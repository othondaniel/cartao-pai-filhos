<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cartão Pai e Filhos</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f7f8fa;
      color: #172b4d;
    }

    .container {
      width: 100%;
    }

    .cabecalho {
      margin-bottom: 18px;
    }

    .titulo {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }

    .subtitulo {
      font-size: 13px;
      color: #6b778c;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;

      border: 1px solid #dfe1e6;
    }

    .etiqueta {
      display: inline-block;

      padding: 4px 8px;

      border-radius: 4px;

      background: #e9f2ff;
      color: #0c66e4;

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 10px;
    }

    .nome-pai {
      font-size: 17px;
      font-weight: 600;

      margin: 0;

      word-break: break-word;
    }

    .progresso-info {
      display: flex;
      justify-content: space-between;

      margin-top: 16px;

      font-size: 12px;
      color: #6b778c;
    }

    .barra {
      width: 100%;
      height: 8px;

      margin-top: 7px;

      background: #dfe1e6;

      border-radius: 10px;

      overflow: hidden;
    }

    .barra-progresso {
      width: 0%;
      height: 100%;

      background: #22a06b;

      transition: width 0.3s;
    }

    .titulo-secao {
      font-size: 15px;
      font-weight: 600;

      margin: 0 0 12px 0;
    }

    .sem-filhos {
      text-align: center;

      padding: 20px 10px;

      color: #6b778c;

      font-size: 13px;
    }

    .botao {
      width: 100%;

      margin-top: 14px;

      padding: 11px;

      border: none;
      border-radius: 6px;

      background: #0c66e4;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .botao:hover {
      background: #0055cc;
    }

    .status {
      margin-top: 12px;

      text-align: center;

      font-size: 11px;

      color: #6b778c;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="cabecalho">

      <h1 class="titulo">
        Cartão Pai e Filhos
      </h1>

      <p class="subtitulo">
        Gerencie as tarefas relacionadas a este cartão.
      </p>

    </div>


    <!-- CARTÃO PAI -->

    <div class="card">

      <span class="etiqueta">
        CARTÃO PAI
      </span>

      <h2
        id="nomePai"
        class="nome-pai">
        Carregando...
      </h2>


      <div class="progresso-info">

        <span>
          Progresso
        </span>

        <span id="percentual">
          0%
        </span>

      </div>


      <div class="barra">

        <div
          id="barraProgresso"
          class="barra-progresso">
        </div>

      </div>

    </div>


    <!-- CARTÕES FILHOS -->

    <div class="card">

      <h3 class="titulo-secao">
        Cartões filhos
      </h3>


      <div
        id="listaFilhos"
        class="sem-filhos">

        Nenhum cartão filho vinculado.

      </div>


      <button
        id="btnAdicionar"
        class="botao">

        + Adicionar cartão filho

      </button>


      <div
        id="status"
        class="status">

      </div>

    </div>

  </div>


  <!-- BIBLIOTECA DO TRELLO -->

  <script src="https://p.trellocdn.com/power-up.min.js"></script>


  <script>

    // Criamos a conexão desta página
    // com o Trello.

    var t = window.TrelloPowerUp.iframe();


    // O Trello chama render() quando
    // a interface precisa ser atualizada.

    t.render(function() {


      // Descobrimos o nome do cartão
      // que está atualmente aberto.

      return t.card('name')

        .then(function(nome) {

          document.getElementById(
            'nomePai'
          ).textContent = nome;

        })

        .catch(function(erro) {

          console.error(
            'Erro ao obter cartão:',
            erro
          );

          document.getElementById(
            'nomePai'
          ).textContent = 'Cartão atual';

        });

    });


    // Botão de adicionar filho.
    //
    // Ainda não cria o vínculo.
    // Isso será implementado na próxima etapa.

    document.getElementById(
      'btnAdicionar'
    ).addEventListener(
      'click',
      function() {

        document.getElementById(
          'status'
        ).textContent =
          'A função de adicionar cartões será implementada na próxima etapa.';

      }
    );

  </script>

</body>

</html>
