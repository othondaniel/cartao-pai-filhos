
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cartão Pai e Filhos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8f9fa;
      color: #172b4d;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .card-pai {
      background: white;
      border: 1px solid #dfe1e6;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .tag {
      display: inline-block;
      background: #e3fcef;
      color: #216e4e;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .progresso {
      height: 8px;
      background: #dfe1e6;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progresso-barra {
      width: 0%;
      height: 100%;
      background: #22a06b;
    }

    .filhos {
      background: white;
      border: 1px solid #dfe1e6;
      border-radius: 10px;
      padding: 16px;
    }

    .tarefa {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      color: #626f86;
      font-size: 14px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #0c66e4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao:hover {
      background: #0055cc;
    }

    .aviso {
      font-size: 12px;
      color: #626f86;
      margin-top: 15px;
      text-align: center;
    }
  </style>

</head>

<body>

  <h2>Cartão Pai e Filhos</h2>

  <div class="card-pai">

    <span class="tag">CARTÃO PAI</span>

    <h3 id="nomePai">Carregando cartão...</h3>

    <div class="progresso">
      <div class="progresso-barra"></div>
    </div>

    <p>0% concluído</p>

  </div>

  <div class="filhos">

    <h3>Cartões filhos</h3>

    <div id="listaFilhos">

      <div class="tarefa">
        Nenhum cartão filho vinculado.
      </div>

    </div>

    <button class="botao" id="btnAdicionar">
      + Adicionar cartão filho
    </button>

    <p class="aviso">
      Versão inicial da interface.
    </p>

  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>

    var t = window.TrelloPowerUp.iframe();

    t.render(function() {

      t.card('name').then(function(nome) {

        document.getElementById('nomePai').textContent = nome;

      }).catch(function() {

        document.getElementById('nomePai').textContent =
          'Cartão principal';

      });

    });

  </script>

</body>
</html>
